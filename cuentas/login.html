      <main>

   <div class="form-card">
      <h1>Crear cuenta</h1>
      <p>Regístrate para explorar y reservar juegos en Ludoteca Roberto.</p>

      <form class="form-registro" action="#" method="post">
         <div class="campo-form">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Roberto Sánchez" required>
         </div>

         <div class="campo-form">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="Ej: correo@ejemplo.com"  minlength="10" required>
         </div>

         <div class="campo-form">
            <label for="usuario">Nombre de usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ej: roberto_asf" required>
         </div>

         <div class="campo-form">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
         </div>

         <div class="campo-form">
            <label for="confirmar-password">Confirmar contraseña</label>
            <input type="password" id="confirmar-password" name="confirmar-password" placeholder="Repite tu contraseña" required>
         </div>

         <div class="campo-check">
            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto los términos y condiciones</label>
         </div>

         <button type="submit" class="btn-form">Registrarme</button>
      </form>
   </div>
