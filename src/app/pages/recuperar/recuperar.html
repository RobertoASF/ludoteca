<section class="hero hero-registro">
  <div class="contenedor">
    <div class="miga">
      <a routerLink="/">Inicio</a>
      <span>/</span>
      <span>Recuperar contraseña</span>
    </div>

    <span class="etiqueta">Recuperación de acceso</span>

    <h1>
      Recuperar <span class="texto-destacado">contraseña.</span>
    </h1>

    <p class="bajada">
      Formulario simulado para cumplir el flujo de recuperación de acceso.
    </p>
  </div>
</section>

<section class="seccion">
  <div class="contenedor">
    <article class="form-card auth-single-card">
      <form class="registro-form" [formGroup]="form" (ngSubmit)="enviarInstrucciones()" novalidate>
        <label class="campo">
          <span>Correo electrónico</span>

          <input
            class="form-control"
            type="email"
            formControlName="correoRecuperacion"
            placeholder="correo@ejemplo.cl">

          <small *ngIf="campoInvalido('correoRecuperacion')">
            Ingresa el correo asociado a tu cuenta.
          </small>
        </label>

        <p aria-live="polite" class="mensaje-formulario" *ngIf="mensaje">
          {{ mensaje }}
        </p>

        <div class="acciones acciones-formulario">
          <button class="boton" type="submit">
            Enviar instrucciones
          </button>

          <a class="boton-secundario" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">
            Volver al login
          </a>
        </div>
      </form>
    </article>
  </div>
</section>
